name: CI

on:
  push:
    branches: [main]
    paths-ignore: [README.md]
  pull_request:
    paths-ignore: [README.md]

permissions: {}

# A new push replaces a queued run; on main a run in progress finishes, so a deploy is never cut off
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gps_crm_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d gps_crm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gps_crm_test
      TEST_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gps_crm_test
      APP_DB_PASSWORD: ciruntimerolepassword
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Migrations from zero, schema invariants, integration tests
        run: npm run test:integration
      - name: Migrations match schema.prisma
        run: npm run db:drift -w @gps_crm/api

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: gps_crm_e2e
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci -d gps_crm_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.6
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025
    env:
      E2E_DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/gps_crm_e2e
      E2E_ADMIN_PASSWORD: administrator password of a throwaway run
      E2E_SMTP_PORT: "1025"
      E2E_MAILPIT_URL: http://127.0.0.1:8025
      APP_DB_PASSWORD: ciruntimerolepassword
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Key of this run only
        run: echo "SECRETS_KEY=$(openssl rand -base64 32)" >>"$GITHUB_ENV"
      - run: npm run test:e2e

  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Secrets in the git history
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git --no-banner --redact --exit-code 1 /repo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Known vulnerabilities in production packages
        run: npm audit --omit=dev --audit-level=high
      - name: Commit authors
        env:
          COMMIT_AUTHOR_EMAIL: ${{ vars.COMMIT_AUTHOR_EMAIL }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash infra/scripts/check-commits.sh "$COMMIT_AUTHOR_EMAIL" "$BASE_SHA" "$HEAD_SHA"

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, integration, e2e, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}" >>"$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Loaded locally first: an image with a critical finding never reaches the registry
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infra/Dockerfile
          load: true
          provenance: false
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          severity: CRITICAL
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image starts
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: bash infra/scripts/smoke-image.sh "$IMAGE_REF"
      - name: Publish
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: docker push "$IMAGE_REF"

  # Separate from `image`: a failed cleanup must not stop a deploy of an image that is already published
  clean-images:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - name: Keep the last 30 versions
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: gps_crm
          package-type: container
          min-versions-to-keep: 30

  deploy-staging:
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    needs: image
    runs-on: ubuntu-24.04
    # Above the worst case on the server: a 15 minute wait for a rollout left by a cancelled run, three stalled pulls of
    # 6 minutes, a 10 minute migration, then the rollout
    timeout-minutes: 50
    permissions:
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: bash infra/scripts/remote-deploy.sh "sha-${GITHUB_SHA}"
