# Local development: PostgreSQL and Mailpit, ports on 127.0.0.1 only. The app runs with `npm run dev`.
name: gps_crm_dev

services:
  db:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_min_duration_statement=500
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-15436}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: the first-start init server listens only on the socket, so a socket check would pass too early
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:${DEV_MAILPIT_UI_PORT:-8026}:8025"
      - "127.0.0.1:${DEV_MAILPIT_SMTP_PORT:-1026}:1025"

volumes:
  db-data:
